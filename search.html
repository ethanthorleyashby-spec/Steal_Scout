<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Steal Scout</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Cpath d='M2 2h18l10 10-10 10H2z' fill='%23ffce3a' stroke='%2313233f' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='12' r='2.5' fill='%2313233f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .app { padding: 8px 0 72px; }
    .app .wrap { max-width: 860px; }
    .search-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .search-form input[type="search"] {
      flex: 1 1 320px; font: inherit; font-size: 1.1rem;
      padding: 15px 18px; border: 2px solid var(--ink); border-radius: 14px; background: #fff;
    }
    .search-form .btn { border-radius: 14px; }
    .examples { font-size: 0.92rem; color: var(--ink-soft); margin: 0 0 22px; }
    .examples button {
      font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line);
      border-radius: 999px; padding: 3px 11px; margin: 4px 4px 0 0; cursor: pointer;
    }
    .code-row { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 18px; }
    .code-row input { font: inherit; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; width: 160px; }
    .summary {
      background: #fff; border: 2px solid var(--ink); border-radius: 14px;
      padding: 14px 18px; margin-bottom: 14px; display: grid; gap: 8px;
    }
    .summary .save { background: var(--sticker); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
    .summary-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 0.95rem; color: var(--ink-soft); }
    .summary-row a { font-weight: 600; color: var(--ink); }
    .warn { font-size: 0.88rem; color: var(--markdown); }
    .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .item {
      display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center;
      background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    }
    .item.top { border: 2px solid var(--save); }
    .item.weak { opacity: .72; }
    .thumb { width: 76px; height: 76px; border-radius: 8px; background: var(--paper); object-fit: contain; }
    .t { font-weight: 600; line-height: 1.3; }
    .t a { text-decoration: none; }
    .t a:hover { text-decoration: underline; }
    .m { font-size: 0.86rem; color: var(--ink-soft); margin-top: 3px; }
    .badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .b { font-size: 0.76rem; font-weight: 700; border-radius: 4px; padding: 1px 7px; }
    .b-fit { background: #e1f3ea; color: var(--save); }
    .b-low { background: #f1f3f6; color: var(--ink-soft); }
    .b-used { background: #eef0ff; color: #3a3fa8; }
    .b-top { background: var(--save); color: #fff; }
    .note { font-size: 0.84rem; color: var(--markdown); margin-top: 4px; }
    .p { text-align: right; }
    .p strong { font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .p s { display: block; font-size: 0.82rem; color: var(--ink-soft); }
    .p .ship { display: block; font-size: 0.8rem; color: var(--ink-soft); }
    .p a { display: block; margin-top: 6px; font-size: 0.86rem; font-weight: 600; }
    .state { text-align: center; padding: 48px 16px; color: var(--ink-soft); }
    .state strong { display: block; font-family: var(--display); font-size: 1.3rem; color: var(--ink); margin-bottom: 6px; }
    .acct { display: flex; gap: 14px; align-items: center; font-size: 0.92rem; color: var(--ink-soft); }
    .acct button { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
    .acct a { font-weight: 600; }
    .welcome { background: #e1f3ea; color: var(--save); border-radius: 12px; padding: 12px 16px; font-weight: 600; margin-bottom: 16px; }
    .state .btn { margin-top: 18px; }
    .state .alt { display: block; margin-top: 12px; font-size: 0.95rem; }
    @media (max-width: 600px) {
      .acct span { display: none; }
      .item { grid-template-columns: 56px 1fr; }
      .thumb { width: 56px; height: 56px; }
      .p { grid-column: 2; text-align: left; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
      .p a { margin-top: 0; }
      .p s, .p .ship { display: inline; margin-left: 6px; }
    }
  </style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="logo" href="/"><span class="logo-tag" aria-hidden="true"></span>Steal Scout</a>
    <div class="acct" id="acct"></div>
  </div>
</header>

<main class="app">
  <div class="wrap">
    <form class="search-form" id="form" role="search">
      <label class="hidden" for="q">What are you shopping for?</label>
      <input id="q" type="search" name="q" placeholder="What do you need? Include size and budget." autocomplete="off" required minlength="3" maxlength="200">
      <button class="btn" type="submit" id="go">Scout it</button>
    </form>
    <p class="examples">Try:
      <button type="button" data-q="air fryer, at least 5 quarts, under $90">air fryer, at least 5 quarts, under $90</button>
      <button type="button" data-q="standing desk at least 55 inches wide under $300">standing desk, 55+ inches, under $300</button>
      <button type="button" data-q="used iphone 13 128gb under $350">used iPhone 13, under $350</button>
    </p>
    <div class="welcome" id="welcome" hidden>Welcome, founding member! You're logged in on this device.</div>
    <div class="code-row" id="code-row" hidden>
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="off">
    </div>

    <div id="out" aria-live="polite">
      <div class="state"><strong>Say what you need, the way you'd say it.</strong>Add a size and a budget and Steal Scout will hold every result to them.</div>
    </div>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var qEl = document.getElementById('q');
  var codeEl = document.getElementById('code');
  var out = document.getElementById('out');
  var go = document.getElementById('go');
  var demo = new URLSearchParams(location.search).has('demo');

  var params = new URLSearchParams(location.search);
  var acct = document.getElementById('acct');
  var member = null;

  // Testers: open search.html?tester once to show the access-code box; the code is remembered on this device.
  try { codeEl.value = localStorage.getItem('ss_code') || ''; } catch (e) {}
  if (params.has('tester') || codeEl.value) document.getElementById('code-row').hidden = false;
  if (params.has('welcome')) document.getElementById('welcome').hidden = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function money(n) { return '$' + Number(n).toFixed(2); }
  function safeUrl(u) { try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } }

  function showState(title, body) {
    out.replaceChildren();
    var s = el('div', 'state');
    s.append(el('strong', null, title), document.createTextNode(body));
    out.append(s);
  }

  function showLoginPrompt(inactive) {
    out.replaceChildren();
    var s = el('div', 'state');
    s.append(el('strong', null, inactive ? 'Your membership isn\u2019t active.' : 'Log in to start scouting.'));
    s.append(document.createTextNode(inactive
      ? 'Rejoin to keep finding the best deals without the ads.'
      : 'Steal Scout search is for founding members. Already a member? We\u2019ll email you a login link.'));
    s.append(el('br'));
    var a = el('a', 'btn', inactive ? 'Rejoin Steal Scout' : 'Log in');
    a.href = inactive ? '/#founding' : '/login.html';
    s.append(a);
    if (!inactive) { var j = el('a', 'alt', 'Not a member yet? Join for $0 today'); j.href = '/#founding'; s.append(j); }
    out.append(s);
  }

  function renderAccount() {
    acct.replaceChildren();
    if (member) {
      acct.append(el('span', null, member.email || 'Member'));
      var b = el('button', null, 'Log out');
      b.type = 'button';
      b.addEventListener('click', function () {
        fetch('/api/logout', { method: 'POST' }).finally(function () { location.href = '/'; });
      });
      acct.append(b);
    } else {
      var a = el('a', null, 'Log in'); a.href = '/login.html'; acct.append(a);
    }
  }

  function render(data) {
    out.replaceChildren();
    var sum = el('div', 'summary');
    if (data.savings && data.firstResult) {
      sum.append(el('div', 'save', 'Top pick is ' + money(data.savings) + ' less than the first result on a normal search' + (data.firstResult.sponsored ? ' (a sponsored listing).' : '.')));
    }
    var row = el('div', 'summary-row');
    var r = data.removed || {};
    var parts = [];
    if (r.sponsored) parts.push(r.sponsored + ' sponsored');
    if (r.overBudget) parts.push(r.overBudget + ' over budget');
    if (r.condition) parts.push(r.condition + ' used');
    row.append(el('span', null, 'Searched ' + data.totalFound + ' listings' + (parts.length ? ', removed ' + parts.join(', ') : '') + '.'));
    var mp = el('a', null, 'Check Facebook Marketplace near you');
    mp.href = data.marketplaceUrl; mp.target = '_blank'; mp.rel = 'noopener';
    row.append(mp);
    sum.append(row);
    (data.warnings || []).forEach(function (w) { sum.append(el('div', 'warn', w)); });
    out.append(sum);

    if (!data.results.length) {
      var s = el('div', 'state');
      s.append(el('strong', null, 'Nothing matched every requirement.'), document.createTextNode('Try a higher budget or fewer must-haves.'));
      out.append(s);
      return;
    }

    var list = el('ol', 'list');
    var topDone = false;
    data.results.forEach(function (it) {
      var good = !it.fails && !it.flagged && it.fit >= 60;
      var li = el('li', 'item' + (good && !topDone ? ' top' : '') + (good ? '' : ' weak'));
      var img = el('img', 'thumb');
      var src = it.thumbnail && safeUrl(it.thumbnail);
      if (src) { img.src = src; img.alt = ''; img.loading = 'lazy'; } else { img.alt = ''; }
      li.append(img);

      var mid = el('div');
      var t = el('div', 't');
      var href = safeUrl(it.link);
      if (href) { var a = el('a', null, it.title); a.href = href; a.target = '_blank'; a.rel = 'noopener nofollow'; t.append(a); }
      else t.textContent = it.title;
      mid.append(t);
      var meta = [it.source];
      if (it.rating != null) meta.push(it.rating + '★' + (it.reviews ? ' from ' + Number(it.reviews).toLocaleString() + ' reviews' : ''));
      if (it.delivery && !(it.shipping > 0)) meta.push(it.delivery);
      mid.append(el('div', 'm', meta.join(' · ')));
      var badges = el('div', 'badges');
      if (good && !topDone) { badges.append(el('span', 'b b-top', 'Top pick')); topDone = true; }
      badges.append(el('span', 'b ' + (good ? 'b-fit' : 'b-low'), it.fit + '% fit'));
      if (it.used) badges.append(el('span', 'b b-used', it.condition || 'Used'));
      mid.append(badges);
      (it.notes || []).forEach(function (n) { mid.append(el('div', 'note', n)); });
      li.append(mid);

      var p = el('div', 'p');
      var total = it.total != null ? it.total : it.price;
      p.append(el('strong', null, money(total)));
      if (it.shipping > 0) p.append(el('span', 'ship', money(it.price) + ' + ' + money(it.shipping) + ' delivery'));
      else if (it.oldPrice && it.oldPrice > it.price) p.append(el('s', null, money(it.oldPrice)));
      if (href) { var v = el('a', null, 'View at ' + it.source); v.href = href; v.target = '_blank'; v.rel = 'noopener nofollow'; p.append(v); }
      li.append(p);
      list.append(li);
    });
    out.append(list);
  }

  function search(q) {
    var code = codeEl.value.trim();
    if (!demo && !member && !code) { showLoginPrompt(false); return; }
    if (code) { try { localStorage.setItem('ss_code', code); } catch (e) {} }
    go.disabled = true; go.textContent = 'Scouting…';
    showState('Scouting stores and marketplaces…', 'Removing sponsored results and checking each listing against what you asked for.');
    var req = demo
      ? new Promise(function (res) { setTimeout(function () { res({ ok: true, json: function () { return DEMO; } }); }, 400); })
      : fetch('/api/search?q=' + encodeURIComponent(q), { headers: code ? { 'x-access-code': code } : {}, credentials: 'same-origin' });
    req.then(function (res) {
      return Promise.resolve(res.json()).then(function (data) {
        if (res.status === 401 && data.reason === 'login') { member = null; renderAccount(); showLoginPrompt(false); return; }
        if (res.status === 403 && data.reason === 'inactive') { member = null; renderAccount(); showLoginPrompt(true); return; }
        if (!res.ok) throw new Error(data.error || 'Search failed.');
        render(data);
      });
    }).catch(function (err) {
      showState('Search didn’t finish.', err.message === 'Failed to fetch' ? 'Check your connection and try again.' : err.message);
    }).finally(function () { go.disabled = false; go.textContent = 'Scout it'; });
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); search(qEl.value.trim()); });
  document.querySelectorAll('[data-q]').forEach(function (b) {
    b.addEventListener('click', function () { qEl.value = b.getAttribute('data-q'); search(qEl.value); });
  });

  // Sample response used only with ?demo in the URL, so the page can be previewed without spending searches.
  var DEMO = {
    totalFound: 9, removed: { sponsored: 2, overBudget: 1, condition: 0 },
    firstResult: { title: 'PrimeChef 6.5 qt', price: 139.99, sponsored: true }, savings: 85,
    marketplaceUrl: 'https://www.facebook.com/marketplace/search/?query=air%20fryer%205%20qt', warnings: [],
    results: [
      { title: 'Kitchen Basics 6-Quart Air Fryer', price: 54.99, oldPrice: 69.99, source: 'Home goods store', rating: 4.6, reviews: 2140, delivery: 'Free delivery', fit: 100, fails: false, notes: [], link: 'https://example.com' },
      { title: '6 Qt Air Fryer, like new', price: 39, source: 'eBay', fit: 100, fails: false, used: true, condition: 'Pre-Owned', notes: [], link: 'https://example.com' },
      { title: 'Countertop 5.8 Qt Air Fryer', price: 64.99, source: 'Warehouse club', rating: 4.5, reviews: 800, fit: 100, fails: false, notes: [], link: 'https://example.com' },
      { title: 'Air Fryer Liners, 100 pack', price: 9.99, source: 'Online retailer', rating: 4.7, reviews: 9000, fit: 37, fails: false, notes: ['Looks like an accessory, not the item'], link: 'https://example.com' },
      { title: 'Compact 4 Quart Air Fryer', price: 49.99, source: 'Department store', rating: 4.4, reviews: 3000, fit: 55, fails: true, notes: ['Wanted 5+ qt, this is 4 qt'], link: 'https://example.com' }
    ]
  };
  if (demo) { member = { email: 'demo@example.com' }; renderAccount(); qEl.value = 'air fryer, at least 5 quarts, under $90'; search(qEl.value); }
  else {
    fetch('/api/me', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) { member = d.member ? d : null; })
      .catch(function () { member = null; })
      .finally(function () {
        renderAccount();
        if (!member && !codeEl.value) showLoginPrompt(false);
        else if (params.get('q')) { qEl.value = params.get('q'); search(qEl.value); }
      });
  }
})();
</script>
</body>
</html>
