[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the search page out of Google until launch
[[headers]]
  for = "/search.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Setup notes are for you, not visitors
[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true
